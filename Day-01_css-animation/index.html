<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="line-1">
      <div class="hover-container">
        <h1>SACLE</h1>
        <div class="hover">
          <img
            src="https://images.unsplash.com/photo-1497366754035-f200968a6e72?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NXx8cHJvZmVzc2lvbmFsJTIwYmFja2dyb3VuZHxlbnwwfHwwfHx8MA%3D%3D"
            alt=""
          />
        </div>
      </div>
      <div class="transform-container">
        <h1>TRANSFORM</h1>
        <div class="transform"></div>
      </div>
      <div class="transform-container2">
        <h1>ROTATE</h1>
      </div>
      <div class="transform-container3">
        <h1>SKEW</h1>
      </div>
      <div class="transform-container4">
        <h1>TRANSFORM-ORIGIN</h1>
      </div>
    </div>
    <div class="line-2">
      <div class="transform5">
        <h1>LINEAR</h1>
      </div>
      <div class="transform5-1">
        <h1>EASE</h1>
      </div>
      <div class="transform5-2">
        <h1>EASE-IN</h1>
      </div>
      <div class="transform5-3">
        <h1>EASE-OUT</h1>
      </div>
      <div class="transform5-4">
        <h1>EASE-IN-OUT</h1>
      </div>
      <div class="transform5-5">
        <h1>EASE-IN-OUT</h1>
      </div>
    </div>
  </body>
</html>
